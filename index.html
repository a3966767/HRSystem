    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('theme-toggle');
            const htmlElement = document.documentElement; // 指向 <html> 標籤
            const themeIcon = document.getElementById('theme-icon'); // 取得圖標的元素

            // --- 核心函式：根據主題更新圖標 ---
            function updateThemeIcon() {
                if (htmlElement.classList.contains('dark')) {
                    themeIcon.textContent = '☀️';
                } else {
                    themeIcon.textContent = '🌙';
                }
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();

            // --- 2. 處理點擊事件 ---
            toggleButton.addEventListener('click', () => {
                // 切換 <html> 標籤上的 'dark' class
                htmlElement.classList.toggle('dark');

                // 將新的主題偏好保存到 localStorage
                if (htmlElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }

                // 💡 點擊後更新圖標狀態
                updateThemeIcon();
            });
        });
    </script>

    <!--                       核心控制腳本區                                -->
    <!-- ================================================================= -->
    
    <!-- 1. 引入 LINE 官方 LIFF SDK 與必要外部套件 -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- 2. 完全防禦性外掛核心程式碼 -->
    <script>
    (function() {
        // ==================== 【填入設定區】 ====================
        const myLiffId = "2010231696-xAAFb5F8"; // 👈 貼上你申請的 LINE LIFF ID
        const myGasUrl = "https://script.google.com/macros/s/AKfycbxifYSE0fyn5LlZS-DcIjREKFi2SJJ2VWQOD_FWuKW819nosTyQE4mXnh-fCpIkjC1s/exec";             // 👈 貼上你第一階段複製的 GAS /exec 網址
        // =======================================================

        let realUserProfile = { lineId: "Web_Test_Mode", name: "網頁測試員" };

        console.log("【考勤核心】正在以純淨防禦模式啟動...");

        // 函式：強制翻開主 UI 畫面
        function forceOpenSystemUI() {
            const loginSection = document.getElementById('login-section');
            const mainApp = document.getElementById('main-app');
            const userHeader = document.getElementById('user-header');
            
            if (loginSection) loginSection.style.display = 'none';
            if (mainApp) mainApp.style.display = 'block';
            if (userHeader) userHeader.style.display = 'flex';
            
            // 清理原本原生程式碼卡住的文字
            const mapLoading = document.getElementById('map-loading-text');
            if (mapLoading) mapLoading.innerText = "已成功串接雲端試算表系統";
        }

        // 函式：綁定打卡按鈕點擊事件
        function bindClockButtons() {
            const btnPunchIn = document.getElementById('punch-in-btn');
            const btnPunchOut = document.getElementById('punch-out-btn');

            if (btnPunchIn && btnPunchOut) {
                // 使用 onclick 覆蓋，徹底防範舊專案其他 JS 檔案的干擾
                btnPunchIn.onclick = function() { sendDataToGoogleSheets("上班"); };
                btnPunchOut.onclick = function() { sendDataToGoogleSheets("下班"); };
                console.log("【考勤核心】上班/下班按鈕事件監聽成功。");
            } else {
                console.error("【錯誤】找不到打卡按鈕元素");
            }
        }

        // 核心：LIFF 初始化與認證流程
        if (myLiffId && myLiffId !== "請改填你的LINE_LIFF_ID") {
            liff.init({ liffId: myLiffId })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        console.log("導向 LINE 登入授權...");
                        liff.login();
                    } else {
                        // 登入成功，讀取真實用戶資料
                        liff.getProfile()
                            .then(profile => {
                                realUserProfile.lineId = profile.userId;
                                realUserProfile.name = profile.displayName;
                                
                                // 將真實姓名與頭像渲染至畫面上
                                const domName = document.getElementById('user-name');
                                const domImg = document.getElementById('profile-img');
                                if (domName) domName.innerText = profile.displayName;
                                if (domImg && profile.pictureUrl) domImg.src = profile.pictureUrl;
                                
                                console.log("【LINE認證成功】歡迎回來: " + profile.displayName);
                                forceOpenSystemUI();
                                bindClockButtons();
                            })
                            .catch(err => {
                                alert("讀取 LINE 個人資料失敗: " + err);
                                forceOpenSystemUI();
                                bindClockButtons();
                            });
                    }
                })
                .catch(err => {
                    console.error("LIFF 初始化失敗, 切換至預設模式:", err);
                    forceOpenSystemUI();
                    bindClockButtons();
                });
        } else {
            // 未填 LIFF_ID 時，自動進入純網頁開發測試模式
            console.log("未偵測到 LIFF_ID，啟動瀏覽器預設測試環境");
            forceOpenSystemUI();
            bindClockButtons();
        }

        // 函式：將打卡資料推送至後端 GAS
        function sendDataToGoogleSheets(punchType) {
            // 動態取得當前畫面顯示的姓名
            const domName = document.getElementById('user-name');
            const finalName = (domName && domName.innerText !== "使用者名稱") ? domName.innerText : realUserProfile.name;

            const payload = {
                lineId: realUserProfile.lineId,
                name: finalName,
                type: punchType
            };

            // 手機端彈出提示，以便確認點擊成功觸發
            alert(`【傳送提示】即將送出【${finalName}】的${punchType}打卡紀錄...`);

            fetch(myGasUrl, {
                method: "POST",
                body: JSON.stringify(payload),
                redirect: "follow",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                }
            })
            .then(res => {
                if (!res.ok) throw new Error("網路伺服器無回應，狀態碼: " + res.status);
                return res.json();
            })
            .then(data => {
                if (data.status === "success") {
                    alert(`🎉 打卡成功！\n雲端試算表回應：${data.message}`);
                } else {
                    alert(`❌ 寫入失敗，後端錯誤：${data.message}`);
                }
            })
            .catch(err => {
                alert(`🚨 連線失敗！\n原因：${err.message}\n請確認您的 GAS 部署設定是否開放給 Anyone。`);
                console.error("詳細連線錯誤:", err);
            });
        }
    })();
    </script>
