    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('theme-toggle');
            const htmlElement = document.documentElement; // 指向 <html> 標籤
            const themeIcon = document.getElementById('theme-icon'); // 取得圖標的元素

            // --- 核心函式：根據主題更新圖標 ---
            function updateThemeIcon() {
                if (htmlElement.classList.contains('dark')) {
                    themeIcon.textContent = '☀️';
                } else {
                    themeIcon.textContent = '🌙';
                }
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();

            // --- 2. 處理點擊事件 ---
            toggleButton.addEventListener('click', () => {
                // 切換 <html> 標籤上的 'dark' class
                htmlElement.classList.toggle('dark');

                // 將新的主題偏好保存到 localStorage
                if (htmlElement.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }

                // 💡 點擊後更新圖標狀態
                updateThemeIcon();
            });
        });
    </script>

    <script>
    (function() {
        // ==================== 【填入設定區】 ====================
        const myLiffId = "2010231696-xAAFb5F8"; // 👈 貼上你申請的 LINE LIFF ID（若先用網頁測試，維持空字串即可）
        const myGasUrl = "https://script.google.com/macros/s/AKfycbxifYSE0fyn5LlZS-DcIjREKFi2SJJ2VWQOD_FWuKW819nosTyQE4mXnh-fCpIkjC1s/exec"; // 👈 已自動帶入您的 GAS 網址
        // =======================================================

        let realUserProfile = { lineId: "Web_Test_Mode", name: "網頁測試員" };

        console.log("【考勤核心】正在以 GPS 增強版模式啟動...");

        // 函式：強制翻開主 UI 畫面
        function forceOpenSystemUI() {
            const loginSection = document.getElementById('login-section');
            const mainApp = document.getElementById('main-app');
            const userHeader = document.getElementById('user-header');
            
            if (loginSection) loginSection.style.display = 'none';
            if (mainApp) mainApp.style.display = 'block';
            if (userHeader) userHeader.style.display = 'flex';
        }

        // 函式：綁定打卡按鈕點擊事件
        function bindClockButtons() {
            const btnPunchIn = document.getElementById('punch-in-btn');
            const btnPunchOut = document.getElementById('punch-out-btn');

            if (btnPunchIn && btnPunchOut) {
                // 覆蓋點擊邏輯，優先導向具有 GPS 擷取功能的流程
                btnPunchIn.onclick = function() { startLocatingProcess("上班"); };
                btnPunchOut.onclick = function() { startLocatingProcess("下班"); };
                console.log("【考勤核心】按鈕 GPS 攔截綁定成功。");
            }
        }

        // 核心流程：初始化 LINE LIFF 認證
        if (myLiffId && myLiffId.trim() !== "") {
            liff.init({ liffId: myLiffId })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        liff.getProfile()
                            .then(profile => {
                                realUserProfile.lineId = profile.userId;
                                realUserProfile.name = profile.displayName;
                                
                                const domName = document.getElementById('user-name');
                                const domImg = document.getElementById('profile-img');
                                if (domName) domName.innerText = profile.displayName;
                                if (domImg && profile.pictureUrl) domImg.src = profile.pictureUrl;
                                
                                forceOpenSystemUI();
                                bindClockButtons();
                            })
                            .catch(err => {
                                alert("讀取 LINE 個人資料失敗: " + err);
                                forceOpenSystemUI();
                                bindClockButtons();
                            });
                    }
                })
                .catch(err => {
                    console.error("LIFF 初始化失敗, 切換至網頁模擬環境:", err);
                    forceOpenSystemUI();
                    bindClockButtons();
                });
        } else {
            console.log("未偵測到 LIFF_ID，啟動瀏覽器預設測試環境");
            forceOpenSystemUI();
            bindClockButtons();
        }

        // 📍 增強功能：GPS 定位程序控制
        function startLocatingProcess(punchType) {
            const domName = document.getElementById('user-name');
            const finalName = (domName && domName.innerText !== "使用者名稱") ? domName.innerText : realUserProfile.name;

            const statusDom = document.getElementById('location-status');
            const coordsDom = document.getElementById('location-coords');

            if (statusDom) statusDom.innerText = "🛰️ 正在擷取精確衛星訊號...";

            // 檢查裝置是否支援定位
            if (navigator.geolocation) {
                
                // 調用手機的高精度衛星定位
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // 更新畫面的定位狀態
                        if (statusDom) statusDom.innerText = "✅ GPS 定位成功";
                        if (coordsDom) coordsDom.innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

                        // 打包含有經緯度資料的封包
                        const payload = {
                            lineId: realUserProfile.lineId,
                            name: finalName,
                            type: punchType,
                            latitude: lat,   // 👈 送給 GAS 的新欄位：緯度
                            longitude: lng   // 👈 送給 GAS 的新欄位：經度
                        };

                        // 執行最終資料上傳
                        uploadPunchRecord(payload);
                    },
                    function(error) {
                        let errorMsg = "未知錯誤";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMsg = "使用者拒絕提供定位權限。請檢查手機瀏覽器設定。";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMsg = "無法取得當前位置訊號。";
                                break;
                            case error.TIMEOUT:
                                errorMsg = "定位逾時。請移動到收訊較佳的地方再試一次。";
                                break;
                        }
                        if (statusDom) statusDom.innerText = "❌ 定位失敗";
                        alert(`🚨 GPS 定位失敗！系統無法驗證打卡地點。\n原因：${errorMsg}`);
                    }, 
                    {
                        enableHighAccuracy: true, // ⚠️ 強制啟用手機高精確度 GPS 控制器
                        timeout: 10000,           // 設定 10 秒內必須抓到訊號
                        maximumAge: 0             // 拒絕讀取快取舊位置，每次都抓最新
                    }
                );

            } else {
                if (statusDom) statusDom.innerText = "❌ 裝置不支援 GPS";
                alert("抱歉，您的手機或瀏覽器不支援內建 GPS 定位功能，
